# 3D 办公室任务看板 —— 一键部署（NAS / 服务器 / 本地 Docker）
#
#   启动： docker compose up -d
#   查看： http://<这台机器的IP>:8787/
#   录任务：curl -X POST http://<这台机器的IP>:8787/api/tasks -H "Content-Type: application/json" -d '{"title":"...","dept":"cfo"}'
#   停掉： docker compose down          （数据在 ./data，不会丢）
#   下线并清库：docker compose down -v  （会删数据卷，慎用）
#
# 想改端口/加令牌：直接改同目录的 board.config.json，或改下面的 environment。
services:
  taskboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: office-taskboard:1.0
    container_name: office-taskboard
    restart: unless-stopped
    ports:
      - "8787:8787"            # 左边是宿主机端口，撞了就改它，如 "18787:8787"
    environment:
      BOARD_DATA_DIR: /app/data
      BOARD_HOST: 0.0.0.0
      BOARD_PORT: "8787"
      # 对外网暴露时强烈建议设一个令牌，然后所有写操作都要带 Authorization: Bearer <token>
      BOARD_TOKEN: ""
    volumes:
      # 数据（任务库 SQLite + 投递箱 + 归档）—— 必须持久化
      - ./data:/app/data
      # 看板读的数据文件（由程序自动生成，不要手改）
      - ./tasks-data:/app/tasks-data
      # 看板本体与 3D 模型包（改看板不用重建镜像，刷新浏览器即可）
      - ./office-3d-taskboard.html:/app/office-3d-taskboard.html:ro
      - ./all-models.js:/app/all-models.js:ro
      # 配置（改完 docker compose restart 生效）
      - ./board.config.json:/app/board.config.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('BOARD_PORT','8787')+'/api/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
