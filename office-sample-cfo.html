<!DOCTYPE html>

<style>

  #tag b{color:#e8786a}
  #hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;padding:10px 22px;background:rgba(255,255,255,.9);color:#3a4a5a;border-radius:22px;font-size:12px;letter-spacing:.4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  #hint span{color:#e8786a;font-weight:600}
</style>
</head>
<body>
<div id="tag"> CFO 财务中心 · <b>卡通海岸风</b> 样板间 v3 · 物件协调</div>
<div id="hint">拖动旋转 · 滚轮缩放 · <span>弧形木板桌 · 宝藏箱 · 贝壳罐 · 绳索装饰</span></div>
<div id="c"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://esm.sh/three@0.157.0/build/three.module.js",
  "three/addons/": "https://esm.sh/three@0.157.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const W=window.innerWidth,H=window.innerHeight;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#bfe0f5');
scene.fog=new THREE.Fog('#cfe8f5',16,34);

const camera=new THREE.PerspectiveCamera(40,W/H,0.1,100);
camera.position.set(6.8,4.4,8.6);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.getElementById('c').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.0,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4.5;controls.maxDistance=16;
controls.maxPolarAngle=Math.PI/2.05;controls.minPolarAngle=0.18;
controls.update();

/* ===== 卡通着色 4 级色阶 ===== */
const steps=new Uint8Array([0x55,0x99,0xcc,0xff]);
const gradientMap=new THREE.DataTexture(steps,steps.length,1,THREE.RedFormat);
gradientMap.minFilter=THREE.NearestFilter;gradientMap.magFilter=THREE.NearestFilter;
gradientMap.generateMipmaps=false;gradientMap.needsUpdate=true;

function TM(c,o={}){return new THREE.MeshToonMaterial({color:c,gradientMap:gradientMap,...o});}
function rbox(w,h,d,mat,r=0.09){const g=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,5,r),typeof mat==='string'?TM(mat):mat);g.castShadow=true;g.receiveShadow=true;return g;}
function box(w,h,d,mat){return rbox(w,h,d,mat,Math.min(w,h,d)*0.18);}
function cyl(rt,rb,h,mat,seg=28){const g=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),typeof mat==='string'?TM(mat):mat);g.castShadow=true;g.receiveShadow=true;return g;}
function sphere(r,mat,seg=20){const g=new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),typeof mat==='string'?TM(mat):mat);g.castShadow=true;g.receiveShadow=true;return g;}
function torus(r,t,mat,seg=24,arc=7){const g=new THREE.Mesh(new THREE.TorusGeometry(r,t,seg,seg,arc),typeof mat==='string'?TM(mat):mat);g.castShadow=true;g.receiveShadow=true;return g;}
// 烘焙变换到几何体（用于合并前）
function bake(geo,x,y,z,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1){
  const c=geo.clone();
  c.applyMatrix4(new THREE.Matrix4().compose(
    new THREE.Vector3(x,y,z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)),
    new THREE.Vector3(sx,sy,sz)));
  return c;
}
// 合并多个几何体为一件完整物件（消除接缝，一体成型）
function merged(parts,mat){
  const idx=parts.filter(g=>g.index!==null).length;
  let geos=parts;
  if(idx>0&&idx<parts.length) geos=parts.map(g=>g.index!==null?g.toNonIndexed():g);
  const g=mergeGeometries(geos);
  const m=new THREE.Mesh(g,typeof mat==='string'?TM(mat):mat);m.castShadow=true;m.receiveShadow=true;return m;
}

// 海岸木板纹理（竖向板缝，对应风格图的弧形木柜台）
function plankTex(base,dark,gapCol,vertical=true){
  const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,512,512);
  const n=7,pw=512/n;
  for(let i=0;i<n;i++){
    x.fillStyle=`rgba(${dark},${0.06+Math.random()*0.06})`;
    if(vertical)x.fillRect(i*pw,0,pw,512);else x.fillRect(0,i*pw,512,pw);
    x.strokeStyle=gapCol;x.lineWidth=2;
    if(vertical){x.beginPath();x.moveTo(i*pw,0);x.lineTo(i*pw,512);x.stroke();}
    else{x.beginPath();x.moveTo(0,i*pw);x.lineTo(512,i*pw);x.stroke();}
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

const MAT={
  floor:new THREE.MeshToonMaterial({map:plankTex('#f0d090','180,130,60','#b8884c'),gradientMap}),
  wallCream:TM('#faf2e2'),
  wallBlue:TM('#c8def0'),
  trim:TM('#d09858'),
  beam:TM('#d8a060'),
  // 海岸木家具（明亮蜜色，竖向板缝）
  coastDesk:new THREE.MeshToonMaterial({map:plankTex('#e8b870','150,95,40','#a86838',true),gradientMap}),
  coastWood:TM('#d8a060'),
  coastWoodDark:TM('#b07840'),
  rope:TM('#e0c890'),
  brass:TM('#e8c060'),
  metalDark:TM('#6a6258'),
  chairCoral:TM('#e8786a'),
  chairDark:TM('#c4584a'),
  leaf:TM('#5cc888'),
  leafDark:TM('#3eb068'),
  pot:TM('#d09868'),
  potBlue:TM('#7ab8d8'),
  glassFrame:TM('#c89868'),
  lampShade:new THREE.MeshToonMaterial({color:'#ffe080',gradientMap,emissive:'#ffcc50',emissiveIntensity:0.6,transparent:true,opacity:0.95}),
  jarGlass:new THREE.MeshPhysicalMaterial({color:'#dff0ff',roughness:0.05,metalness:0,transparent:true,opacity:0.3,transmission:0.6}),
  mugCoral:TM('#ff8870'),
  keyboard:TM('#e8e8e0'),
  note:TM('#fff060'),
  note2:TM('#ffc870'),
  shellPink:TM('#f0a8b0'),
  shellCream:TM('#fff0d8'),
  lighthouseR:TM('#e85858'),
  lighthouseW:TM('#fff8f0'),
};

/* ===== 灯光 ===== */
scene.add(new THREE.AmbientLight('#fff0e0',0.8));
const winLight=new THREE.DirectionalLight('#dceeff',2.4);
winLight.position.set(0,4.2,-6.5);winLight.castShadow=true;
winLight.shadow.mapSize.set(2048,2048);
winLight.shadow.camera.left=-6;winLight.shadow.camera.right=6;
winLight.shadow.camera.top=6;winLight.shadow.camera.bottom=-6;
winLight.shadow.camera.near=1;winLight.shadow.camera.far=20;winLight.shadow.bias=-0.0008;
scene.add(winLight);
const fill=new THREE.DirectionalLight('#ffe8b0',0.6);fill.position.set(7,5,6);scene.add(fill);
const pendantLight=new THREE.PointLight('#ffd870',1.8,10,1.6);pendantLight.position.set(0,2.4,0.4);scene.add(pendantLight);
const deskLampLight=new THREE.PointLight('#ffb858',0.8,3.5,2);deskLampLight.position.set(-1.35,1.28,0.05);scene.add(deskLampLight);

/* ===== 房间结构 ===== */
const ROOM={w:7,d:6,h:2.8},hw=ROOM.w/2,hd=ROOM.d/2;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w,ROOM.d),MAT.floor);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// 海岸风地毯（波浪/贝壳花纹）
function rugTex(){
  const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
  x.fillStyle='#bcd8e8';x.fillRect(0,0,256,256);
  x.strokeStyle='#88b0c8';x.lineWidth=3;
  for(let r=20;r<120;r+=24){x.beginPath();x.arc(128,128,r,0,Math.PI*2);x.stroke();}
  x.fillStyle='#a8c8dc';
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2;x.beginPath();x.arc(128+Math.cos(a)*90,128+Math.sin(a)*90,8,0,Math.PI*2);x.fill();}
  x.strokeStyle='#88b0c8';x.lineWidth=6;x.strokeRect(12,12,232,232);
  return new THREE.CanvasTexture(c);
}
const rug=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2.4),new THREE.MeshToonMaterial({map:rugTex(),gradientMap}));
rug.rotation.x=-Math.PI/2;rug.position.set(0,0.012,0.6);rug.receiveShadow=true;scene.add(rug);

const backWall=box(ROOM.w,ROOM.h,0.18,MAT.wallCream);backWall.position.set(0,ROOM.h/2,-hd);scene.add(backWall);
const leftWall=box(0.18,ROOM.h,ROOM.d,MAT.wallBlue);leftWall.position.set(-hw,ROOM.h/2,0);scene.add(leftWall);
const rightWall=box(0.18,ROOM.h,ROOM.d,MAT.wallCream);rightWall.position.set(hw,ROOM.h/2,0);scene.add(rightWall);
const frontL=box(1.6,ROOM.h,0.18,MAT.wallBlue);frontL.position.set(-hw+0.8,ROOM.h/2,hd);scene.add(frontL);
const frontR=box(1.6,ROOM.h,0.18,MAT.wallCream);frontR.position.set(hw-0.8,ROOM.h/2,hd);scene.add(frontR);
function baseboard(x,z,w,d){const b=box(w,0.14,d,MAT.trim);b.position.set(x,0.07,z);b.castShadow=false;scene.add(b);}
baseboard(0,-hd+0.09,ROOM.w,0.18);baseboard(-hw+0.09,0,0.18,ROOM.d);baseboard(hw-0.09,0,0.18,ROOM.d);
baseboard(-hw+1.6,hd-0.09,1.6,0.18);baseboard(hw-1.6,hd-0.09,1.6,0.18);
const beam1=box(ROOM.w,0.24,0.24,MAT.beam);beam1.position.set(0,ROOM.h-0.12,-hd+1.5);scene.add(beam1);
const beam2=box(ROOM.w,0.24,0.24,MAT.beam);beam2.position.set(0,ROOM.h-0.12,hd-1.5);scene.add(beam2);
const crossBeam=box(0.22,0.18,ROOM.d-3,MAT.beam);crossBeam.position.set(0,ROOM.h-0.1,0.4);scene.add(crossBeam);

/* ===== 拱形大窗 + 卡通海景 ===== */
function sceneryTex(){
  const c=document.createElement('canvas');c.width=1024;c.height=768;const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,768);g.addColorStop(0,'#a8d8ff');g.addColorStop(0.6,'#dff0ff');g.addColorStop(1,'#fff0d0');
  x.fillStyle=g;x.fillRect(0,0,1024,768);
  let rg=x.createRadialGradient(720,230,10,720,230,160);rg.addColorStop(0,'rgba(255,250,180,1)');rg.addColorStop(1,'rgba(255,250,180,0)');
  x.fillStyle=rg;x.fillRect(0,0,1024,768);
  x.fillStyle='#fff8c0';x.beginPath();x.arc(720,230,42,0,7);x.fill();
  x.fillStyle='#b0d0a0';x.beginPath();x.moveTo(0,560);
  x.arc(150,560,120,Math.PI,0);x.arc(380,560,140,Math.PI,0);x.arc(640,560,130,Math.PI,0);x.arc(880,560,110,Math.PI,0);
  x.lineTo(1024,768);x.lineTo(0,768);x.closePath();x.fill();
  x.fillStyle='#88c098';x.beginPath();x.moveTo(0,640);
  x.arc(200,640,100,Math.PI,0);x.arc(450,640,120,Math.PI,0);x.arc(720,640,110,Math.PI,0);x.arc(950,640,90,Math.PI,0);
  x.lineTo(1024,768);x.lineTo(0,768);x.closePath();x.fill();
  x.fillStyle='#8ccae0';x.fillRect(0,650,1024,118);
  x.fillStyle='rgba(255,250,200,0.6)';for(let i=0;i<12;i++)x.fillRect(650+i*10,656+i*7,70+i*4,3);
  x.fillStyle='rgba(255,255,255,0.95)';
  function cloud(cx,cy,s){x.save();x.translate(cx,cy);x.scale(s,s);
    x.beginPath();x.arc(0,0,30,0,7);x.arc(34,-8,26,0,7);x.arc(64,2,24,0,7);x.arc(26,12,28,0,7);x.arc(-6,8,22,0,7);x.fill();x.restore();}
  cloud(180,150,1.3);cloud(500,100,1);cloud(820,170,1.1);cloud(350,200,0.8);
  return new THREE.CanvasTexture(c);
}
const winG=new THREE.Group();const winW=3.4,winH=2.2,winY=1.0;
const scenery=new THREE.Mesh(new THREE.PlaneGeometry(winW+0.3,winH+0.6),new THREE.MeshBasicMaterial({map:sceneryTex()}));
scenery.position.set(0,winY+winH/2-0.1,-hd-0.02);winG.add(scenery);
function archFrame(){
  const f=new THREE.Group();const fm=MAT.glassFrame;
  const afL=cyl(0.07,0.07,winH,fm);afL.position.set(-winW/2,winY+winH/2,0);f.add(afL);
  const afR=cyl(0.07,0.07,winH,fm);afR.position.set(winW/2,winY+winH/2,0);f.add(afR);
  const afB=box(winW+0.14,0.14,0.1,fm);afB.position.set(0,winY,0);f.add(afB);
  const arcR=winW/2;
  for(let i=0;i<=16;i++){const a=Math.PI-i*(Math.PI/16);
    const seg=cyl(0.07,0.07,0.18,fm,8);seg.position.set(Math.cos(a)*arcR,winY+winH+Math.sin(a)*arcR,0);seg.rotation.z=a-Math.PI/2;f.add(seg);}
  const afMullV=box(0.08,winH,0.08,fm);afMullV.position.set(0,winY+winH/2,0.02);f.add(afMullV);
  const afMullH=box(winW,0.08,0.08,fm);afMullH.position.set(0,winY+winH/2,0.02);f.add(afMullH);
  return f;
}
winG.add(archFrame());
const glass=new THREE.Mesh(new THREE.PlaneGeometry(winW-0.1,winH-0.1),
  new THREE.MeshPhysicalMaterial({color:'#dceeff',roughness:0.05,metalness:0,transparent:true,opacity:0.15,transmission:0.5}));
glass.position.set(0,winY+winH/2,-hd+0.04);winG.add(glass);
winG.position.z=-hd+0.02;scene.add(winG);
const sill=box(winW+0.5,0.12,0.3,MAT.trim);sill.position.set(0,winY-0.06,-hd+0.1);scene.add(sill);

/* ===== 绳索花环（风格图标志：梁上缠航海绳） ===== */
const ropeG=new THREE.Group();
// 横梁上缠绕的粗绳（两段梁各缠一道）
[[-hd+1.5],[hd-1.5]].forEach(([z])=>{
  const wrap=torus(0.16,0.045,MAT.rope,16,Math.PI*2);wrap.position.set(0.6,ROOM.h-0.12,z);wrap.rotation.x=Math.PI/2;ropeG.add(wrap);
  const wrap2=torus(0.16,0.045,MAT.rope,16,Math.PI*2);wrap2.position.set(-0.7,ROOM.h-0.12,z);wrap2.rotation.x=Math.PI/2;ropeG.add(wrap2);
});
// 梁间垂挂的绳索装饰（流苏）
for(let i=-1;i<=1;i+=2){
  const drape=cyl(0.012,0.012,0.5,MAT.rope,8);drape.position.set(i*1.2,ROOM.h-0.35,0.4);drape.rotation.z=i*0.1;ropeG.add(drape);
  // 绳端绳结球
  const knot=sphere(0.04,MAT.rope,10);knot.position.set(i*1.25,ROOM.h-0.6,0.4);ropeG.add(knot);
}
scene.add(ropeG);

/* ===== 圆润吊灯（绳索吊，对应风格图） ===== */
const pendantG=new THREE.Group();
const cord=cyl(0.022,0.022,0.7,MAT.rope,8);cord.position.set(0,2.75,0.4);pendantG.add(cord);
const shade=new THREE.Mesh(new THREE.SphereGeometry(0.24,28,18,0,Math.PI*2,0,Math.PI*0.55),MAT.lampShade);
shade.scale.set(1,0.9,1);shade.position.set(0,2.42,0.4);shade.rotation.x=Math.PI;pendantG.add(shade);
const cap=cyl(0.22,0.22,0.05,MAT.metalDark,16);cap.position.set(0,2.54,0.4);pendantG.add(cap);
const bulb=sphere(0.1,new THREE.MeshBasicMaterial({color:'#fff0b0'}));bulb.position.set(0,2.4,0.4);pendantG.add(bulb);
// 灯罩与绳交接处的绳结
const pKnot=sphere(0.05,MAT.rope,12);pKnot.position.set(0,2.6,0.4);pendantG.add(pKnot);
scene.add(pendantG);

/* ============================================================
   海岸风家具（物件本身协调卡通海岸风）
   1. 弧形木板办公桌（风格图的弧形木柜台）
   2. 宝藏箱式保险柜（海岸+财务=宝藏）
   3. 贝壳玻璃罐置物架（替代铁皮文件柜）
   4. 珊瑚色圆润办公椅
   5. 悬挂绿植 / 落地绿植 / 桌面多肉
   6. 灯塔摆件 / 贝壳摆件 / 沙滩明信片墙
============================================================ */

// --- 1. 弧形木板办公桌（前面板弧形 + 竖向板缝蜜色木） ---
const deskG=new THREE.Group();
const DW=2.6,DD=1.15;
// 桌面（厚圆角板）
const dTop=box(DW,0.08,DD,MAT.coastDesk);dTop.position.set(0,0.78,0);deskG.add(dTop);
// 前面板：用半圆柱做出弧形前台（风格图弧形柜台）
const frontCurve=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.7,24,1,false,0,Math.PI),
  MAT.coastDesk);frontCurve.scale.set(DW/1.1,1,0.7);
frontCurve.position.set(0,0.42,DD/2-0.05);frontCurve.rotation.set(-Math.PI/2,0,0);deskG.add(frontCurve);
// 桌后侧板
const backPanel=box(DW,0.7,0.06,MAT.coastWood);backPanel.position.set(0,0.42,-DD/2+0.03);deskG.add(backPanel);
// 桌腿（粗壮圆角，海岸风）
[[-DW/2+0.15,-DD/2+0.15],[DW/2-0.15,-DD/2+0.15],[-DW/2+0.15,DD/2-0.15],[DW/2-0.15,DD/2-0.15]].forEach(([lx,lz])=>{
  const leg=box(0.1,0.78,0.1,MAT.coastWoodDark);leg.position.set(lx,0.39,lz);deskG.add(leg);
});
// 抽屉（弧形前板上的圆角抽屉 + 绳环拉手）
const drawer=rbox(0.42,0.22,0.06,MAT.coastWood,0.04);drawer.position.set(0,0.5,DD/2-0.02);deskG.add(drawer);
const drawerPull=torus(0.04,0.012,MAT.rope,12,Math.PI*2);drawerPull.position.set(0,0.5,DD/2+0.02);drawerPull.rotation.x=Math.PI/2;deskG.add(drawerPull);
// 桌底藤编收纳筐（海岸风）
const basketG=new THREE.Group();
const basket=cyl(0.22,0.18,0.28,MAT.rope,20);basket.position.y=0.14;basketG.add(basket);
const basketRim=cyl(0.22,0.22,0.05,MAT.coastWoodDark,20);basketRim.position.y=0.28;basketG.add(basketRim);
basketG.position.set(-0.6,0,0.05);basketG.scale.set(1,1,1.1);deskG.add(basketG);

// 双显示器（圆角厚实卡通款）
[[-0.42],[0.42]].forEach(([ox])=>{
  const mon=rbox(0.6,0.38,0.06,TM('#2a2832'),0.05);mon.position.set(ox,1.05,-0.15);deskG.add(mon);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(0.52,0.34),new THREE.MeshBasicMaterial({color:'#5ab0d0'}));scr.position.set(ox,1.05,-0.12);deskG.add(scr);
  const bar=new THREE.Mesh(new THREE.PlaneGeometry(0.32,0.04),new THREE.MeshBasicMaterial({color:'#7ad890'}));bar.position.set(ox-0.05,1.12,-0.115);deskG.add(bar);
